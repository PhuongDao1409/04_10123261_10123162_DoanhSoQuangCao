version: "3.8"

services:
  ai-service:
    build:
      context: ./ai-models
      dockerfile: Dockerfile
    container_name: advertising_ai_service
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: advertising_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8001}
    depends_on:
      ai-service:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: advertising_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: always
